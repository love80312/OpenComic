name: Test Build

on:
  workflow_dispatch:
  push:
    branches:
      - test

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref_name }}
          path: source
          fetch-depth: 1

      - name: Compute version
        id: ver
        shell: bash
        run: |
          APP_VERSION="$(node -p "require('./source/package.json').version")"
          SHA="$(git -C source rev-parse --short=7 HEAD)"
          echo "version=v${APP_VERSION}-${SHA}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.variant }}-${{ matrix.ext }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            variant: win-x64
            build: npm run build-nsis
            extraDeps: |
              npm install @img-custom/sharp-win32-arm64 @img-custom/sharp-win32-x64 --force && node scripts/sharp-copy-custom.js
            ext: exe

          - os: windows-latest
            variant: win-x64-portable
            build: npm run build-portable
            extraDeps: |
              npm install @img-custom/sharp-win32-arm64 @img-custom/sharp-win32-x64 --force && node scripts/sharp-copy-custom.js
            ext: exe

          - os: windows-latest
            variant: win-x64-folder-portable
            build: npm run build-folder-portable
            extraDeps: |
              npm install @img-custom/sharp-win32-arm64 @img-custom/sharp-win32-x64 --force && node scripts/sharp-copy-custom.js
            ext: exe

          - os: windows-latest
            variant: win-x64-folder-portable
            build: npm run build-folder-portable-7z
            extraDeps: |
              npm install @img-custom/sharp-win32-arm64 @img-custom/sharp-win32-x64 --force && node scripts/sharp-copy-custom.js
            ext: 7z

          - os: windows-latest
            variant: win-arm64
            build: npm run build-nsis-arm
            extraDeps: |
              npm install @img-custom/sharp-win32-arm64 @img-custom/sharp-win32-x64 --force && node scripts/sharp-copy-custom.js
            ext: exe

          - os: ubuntu-latest
            variant: linux-x64
            build: npm run build-deb
            extraDeps: |
              npm install @img-custom/sharp-libvips-linuxmusl-x64 @img-custom/sharp-libvips-linux-x64 @img-custom/sharp-linuxmusl-x64 @img-custom/sharp-linux-x64 --force && node scripts/sharp-copy-custom.js
              npm install @img-custom/sharp-libvips-linux-arm64 @img-custom/sharp-libvips-linuxmusl-arm64 @img-custom/sharp-linux-arm64 @img-custom/sharp-linuxmusl-arm64 --force && node scripts/sharp-copy-custom.js
            ext: deb

          - os: ubuntu-latest
            variant: linux-x64
            build: npm run build-appimage
            extraDeps: |
              npm install @img-custom/sharp-libvips-linuxmusl-x64 @img-custom/sharp-libvips-linux-x64 @img-custom/sharp-linuxmusl-x64 @img-custom/sharp-linux-x64 --force && node scripts/sharp-copy-custom.js
              npm install @img-custom/sharp-libvips-linux-arm64 @img-custom/sharp-libvips-linuxmusl-arm64 @img-custom/sharp-linux-arm64 @img-custom/sharp-linuxmusl-arm64 --force && node scripts/sharp-copy-custom.js
            ext: AppImage

          - os: ubuntu-latest
            variant: linux-x64
            build: npm run build-flatpak
            extraDeps: |
              npm install @img-custom/sharp-libvips-linuxmusl-x64 @img-custom/sharp-libvips-linux-x64 @img-custom/sharp-linuxmusl-x64 @img-custom/sharp-linux-x64 --force && node scripts/sharp-copy-custom.js
              npm install @img-custom/sharp-libvips-linux-arm64 @img-custom/sharp-libvips-linuxmusl-arm64 @img-custom/sharp-linux-arm64 @img-custom/sharp-linuxmusl-arm64 --force && node scripts/sharp-copy-custom.js
            ext: flatpak

          - os: ubuntu-latest
            variant: linux-x64-folder-portable
            build: npm run build-linux-folder-portable-x64
            extraDeps: |
              npm install @img-custom/sharp-libvips-linuxmusl-x64 @img-custom/sharp-libvips-linux-x64 @img-custom/sharp-linuxmusl-x64 @img-custom/sharp-linux-x64 --force && node scripts/sharp-copy-custom.js
              npm install @img-custom/sharp-libvips-linux-arm64 @img-custom/sharp-libvips-linuxmusl-arm64 @img-custom/sharp-linux-arm64 @img-custom/sharp-linuxmusl-arm64 --force && node scripts/sharp-copy-custom.js
            ext: 7z

          - os: ubuntu-latest
            variant: linux-arm64
            build: npm run build-deb-arm
            extraDeps: |
              npm install @img-custom/sharp-libvips-linuxmusl-x64 @img-custom/sharp-libvips-linux-x64 @img-custom/sharp-linuxmusl-x64 @img-custom/sharp-linux-x64 --force && node scripts/sharp-copy-custom.js
              npm install @img-custom/sharp-libvips-linux-arm64 @img-custom/sharp-libvips-linuxmusl-arm64 @img-custom/sharp-linux-arm64 @img-custom/sharp-linuxmusl-arm64 --force && node scripts/sharp-copy-custom.js
            ext: deb

          - os: ubuntu-latest
            variant: linux-arm64
            build: npm run build-appimage-arm
            extraDeps: |
              npm install @img-custom/sharp-libvips-linuxmusl-x64 @img-custom/sharp-libvips-linux-x64 @img-custom/sharp-linuxmusl-x64 @img-custom/sharp-linux-x64 --force && node scripts/sharp-copy-custom.js
              npm install @img-custom/sharp-libvips-linux-arm64 @img-custom/sharp-libvips-linuxmusl-arm64 @img-custom/sharp-linux-arm64 @img-custom/sharp-linuxmusl-arm64 --force && node scripts/sharp-copy-custom.js
            ext: AppImage

          - os: ubuntu-latest
            variant: linux-arm64-folder-portable
            build: npm run build-linux-folder-portable-arm
            extraDeps: |
              npm install @img-custom/sharp-libvips-linuxmusl-x64 @img-custom/sharp-libvips-linux-x64 @img-custom/sharp-linuxmusl-x64 @img-custom/sharp-linux-x64 --force && node scripts/sharp-copy-custom.js
              npm install @img-custom/sharp-libvips-linux-arm64 @img-custom/sharp-libvips-linuxmusl-arm64 @img-custom/sharp-linux-arm64 @img-custom/sharp-linuxmusl-arm64 --force && node scripts/sharp-copy-custom.js
            ext: 7z

          - os: macos-26-intel
            variant: mac-x64
            build: npm run build-mac-dmg-nightly
            extraDeps: |
              npm install @img-custom/sharp-darwin-x64 @img-custom/sharp-libvips-darwin-x64 --force && node scripts/sharp-copy-custom.js
              npm install @img-custom/sharp-darwin-arm64 @img-custom/sharp-libvips-darwin-arm64 --force && node scripts/sharp-copy-custom.js
            ext: dmg

          - os: macos-26
            variant: mac-arm64
            build: npm run build-mac-dmg-nightly-arm
            extraDeps: |
              npm install @img-custom/sharp-darwin-x64 @img-custom/sharp-libvips-darwin-x64 --force && node scripts/sharp-copy-custom.js
              npm install @img-custom/sharp-darwin-arm64 @img-custom/sharp-libvips-darwin-arm64 --force && node scripts/sharp-copy-custom.js
            ext: dmg

    steps:
      - name: Checkout source repo (OpenComic)
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref_name }}
          path: source
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install Node Zstd native dependencies
        run: npm install --force
        working-directory: source/build/node-zstd-native-dependencies

      - name: Install deps
        working-directory: source
        run: npm install

      - name: Install extra deps for sharp
        working-directory: source
        run: ${{ matrix.extraDeps }}

      - name: Copy zstd native modules
        working-directory: source
        run: node scripts/zstd-copy-native.js

      - name: Install Flatpak tooling (Linux Flatpak builds only)
        if: startsWith(matrix.build, 'npm run build-flatpak')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak runtime/SDK (Linux Flatpak builds only)
        if: startsWith(matrix.build, 'npm run build-flatpak')
        shell: bash
        run: |
          sudo flatpak install -y --noninteractive flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Platform/aarch64/24.08 \
            org.freedesktop.Sdk//24.08 \
            org.electronjs.Electron2.BaseApp//24.08

      - name: Build
        working-directory: source
        run: ${{ matrix.build }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          NIGHTLY: true

      - name: Collect & rename artifacts
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VARIANT="${{ matrix.variant }}"
          EXT="${{ matrix.ext }}"
          mkdir -p release

          find source/dist -maxdepth 1 -type f -name "*.${{ matrix.ext }}" | while read -r file; do
            newname="OpenComic-${VERSION}-${VARIANT}.${EXT}"
            cp "$file" "release/$newname"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenComic-${{ matrix.variant }}-${{ matrix.ext }}
          path: release/*
          retention-days: 7
